data:
  csv_path: "data/labels.csv"
  n_frames: 16
  batch_size: 32
  num_workers: 4
  split: [0.8, 0.1, 0.1]

features:
  cache_dir: "/vol/bitbucket/scs22/fyp/features_cache"
  device: "cuda"

sononet:
  dir: "/vol/biomedic3/bkainz/sononet_logs"
  conf_threshold: 0.5
  cache_dir: "/vol/bitbucket/scs22/fyp/features_cache_4ch"

training:
  seed: 42
  mlp_epochs: 100
  mlp_lr: 1e-3
  mlp_weight_decay: 1e-4
  early_stopping_patience: 10

vos:
  epochs: 100
  lr: 1e-3
  weight_decay: 1e-4
  batch_size: 64
  dropout: 0.3
  lambda_vos: 0.1
  virtual_outliers_per_batch: 64
  tail_q_low: 0.95
  tail_q_high: 0.999
  covariance: "ledoit_wolf"
  covariance_jitter: 1e-4
  early_stopping_patience: 10

edl:
  epochs: 100
  lr: 1e-3
  weight_decay: 1e-4
  batch_size: 64
  dropout: 0.3
  evidence_activation: "relu"
  annealing_epochs: 10
  early_stopping_patience: 10
